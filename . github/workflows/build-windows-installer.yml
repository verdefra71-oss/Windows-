name: Build Preventivi Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'pubspec.yaml')) { throw 'pubspec.yaml non trovato nella root del repository.' }
          if (-not (Test-Path 'lib\main.dart')) { throw 'lib/main.dart non trovato.' }
          if (-not (Test-Path 'assets\logo.png')) { throw 'assets/logo.png non trovato.' }
          Write-Host 'Progetto Flutter trovato.'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Recreate Windows platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'windows') {
            Remove-Item 'windows' -Recurse -Force
          }
          flutter create --platforms=windows --project-name preventivi_app .

      - name: Remove generated sample test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'test\widget_test.dart') {
            Remove-Item 'test\widget_test.dart' -Force
          }
          if (Test-Path 'test') {
            $items = Get-ChildItem 'test' -Force
            if (-not $items) {
              Remove-Item 'test' -Recurse -Force
            }
          }

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze application
        shell: pwsh
        run: flutter analyze lib

      - name: Verify Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe non trovato.'
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio 2022 con gli strumenti C++ non trovato.'
          }
          Write-Host "Visual Studio: $vs"

      - name: Clean Flutter and CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'build') {
            Remove-Item 'build' -Recurse -Force
          }
          if (Test-Path 'windows\flutter\ephemeral') {
            Remove-Item 'windows\flutter\ephemeral' -Recurse -Force
          }
          flutter clean
          flutter pub get

      - name: Build Windows Release
        shell: pwsh
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) {
            throw "Cartella Release non trovata: $release"
          }

          $exe = Join-Path $release 'preventivi_app.exe'
          if (-not (Test-Path $exe)) {
            $candidate = Get-ChildItem $release -Filter '*.exe' -File | Select-Object -First 1
            if (-not $candidate) {
              throw 'Nessun file EXE trovato nella Release.'
            }
            Copy-Item $candidate.FullName $exe -Force
          }

          "WINDOWS_RELEASE_DIR=$release" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXE pronto: $exe"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "$env:WINDOWS_RELEASE_DIR\*" -DestinationPath "$env:GITHUB_WORKSPACE\Preventivi-Windows-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'ISCC.exe non trovato.'
          }

          & $iscc `
            /DReleaseDir="$env:WINDOWS_RELEASE_DIR" `
            /DMyAppVersion='1.0.0' `
            "$env:GITHUB_WORKSPACE\installer\Preventivi.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup ha restituito codice $LASTEXITCODE."
          }

          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer\Output\Preventivi-Setup.exe'
          if (-not (Test-Path $setup)) {
            throw 'Preventivi-Setup.exe non generato.'
          }

          Copy-Item $setup "$env:GITHUB_WORKSPACE\Preventivi-Setup.exe" -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Installer
          path: |
            Preventivi-Setup.exe
            Preventivi-Windows-Portable.zip
          if-no-files-found: error
          compression-level: 0
