name: Build Preventivi Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Find Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pubspec = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter pubspec.yaml -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\.dart_tool\\' } |
            Select-Object -First 1
          if (-not $pubspec) { throw 'pubspec.yaml non trovato.' }
          "APP_DIR=$($pubspec.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows project
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          if (-not (Test-Path 'windows\CMakeLists.txt')) {
            flutter create --platforms=windows --project-name preventivi_app .
          }
          if (-not (Test-Path 'windows\CMakeLists.txt')) { throw 'Progetto Windows non generato.' }

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Validate Dart project
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Build Windows x64 Release
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          flutter pub get
          $env:CMAKE_GENERATOR = 'Visual Studio 17 2022'
          $env:CMAKE_GENERATOR_PLATFORM = 'x64'
          flutter build windows --release

      - name: Verify Windows release
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:APP_DIR 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) { throw "Release non trovata: $release" }
          $exe = Join-Path $release 'preventivi_app.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path $release -Filter '*.exe' -File | Select-Object -First 1
          }
          if (-not $exe) { throw 'Nessun EXE Windows trovato.' }
          Write-Host "EXE: $($exe.FullName)"
          "WINDOWS_RELEASE_DIR=$release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read application version
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*([^\s]+)' | Select-Object -First 1
          $version = if ($line) { $line.Matches.Groups[1].Value.Split('+')[0] } else { '1.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { $version = '1.0.0' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versione: $version"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe non trovato.' }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build professional installer
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = Join-Path $env:GITHUB_WORKSPACE 'installer\Preventivi.iss'
          if (-not (Test-Path $iss)) { throw "Script Inno Setup non trovato: $iss" }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'dist') | Out-Null
          & $env:ISCC /DReleaseDir="$env:WINDOWS_RELEASE_DIR" /DMyAppVersion="$env:APP_VERSION" $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha restituito codice $LASTEXITCODE" }

      - name: Create clean portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist\Preventivi-Windows-Portable.zip'
          Compress-Archive -Path "$env:WINDOWS_RELEASE_DIR\*" -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Installer
          path: dist/Preventivi-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Portable
          path: dist/Preventivi-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
