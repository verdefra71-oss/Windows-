name: Build Preventivi Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'pubspec.yaml')) {
            throw 'pubspec.yaml non trovato nella root del repository.'
          }
          if (-not (Test-Path 'lib\main.dart')) {
            throw 'lib/main.dart non trovato.'
          }
          if (-not (Test-Path 'assets\logo.png')) {
            throw 'assets/logo.png non trovato.'
          }

          Write-Host 'Progetto Flutter trovato.'

      # Flutter 3.38.1 usa una logica Visual Studio che nel runner attuale
      # finisce per chiedere il generatore VS2019. Il runner windows-latest
      # dispone invece di Visual Studio 2026 (major 18).
      # Flutter 3.47.2 aggiorna la gestione del progetto Windows.
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter and Visual Studio toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '=== FLUTTER VERSION ==='
          flutter --version

          Write-Host '=== FLUTTER DOCTOR WINDOWS ==='
          flutter doctor -v

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe non trovato.'
          }

          $vsJson = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsJson) {
            throw 'Nessuna installazione Visual Studio con strumenti C++ trovata.'
          }

          $vsPath = $vsJson.Trim()
          Write-Host "Visual Studio selezionato: $vsPath"

          $cmake = Get-Command cmake -ErrorAction Stop
          Write-Host "CMake: $($cmake.Source)"

          Write-Host '=== CMAKE GENERATORS ==='
          cmake --help | Select-String 'Visual Studio|Ninja'

          $cmakeHelp = cmake --help | Out-String
          if (-not ($cmakeHelp -match 'Visual Studio 18 2026')) {
            throw 'Il CMake disponibile nel runner non espone il generatore Visual Studio 18 2026.'
          }

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Recreate Windows platform with current Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Elimina completamente il vecchio progetto Windows: non deve
          # sopravvivere alcuna configurazione CMake/Visual Studio 2019.
          if (Test-Path 'windows') {
            Remove-Item 'windows' -Recurse -Force
          }
          if (Test-Path 'build') {
            Remove-Item 'build' -Recurse -Force
          }

          flutter create --platforms=windows --project-name preventivi_app .

          if (-not (Test-Path 'windows\CMakeLists.txt')) {
            throw 'Flutter non ha generato windows/CMakeLists.txt.'
          }

          Write-Host 'Piattaforma Windows rigenerata correttamente con Flutter.'

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze application
        shell: pwsh
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Clean Flutter build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          if (Test-Path 'build') {
            Remove-Item 'build' -Recurse -Force
          }
          if (Test-Path 'windows\flutter\ephemeral') {
            Remove-Item 'windows\flutter\ephemeral' -Recurse -Force
          }
          flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Non impostiamo CMAKE_GENERATOR: Flutter deve rilevare direttamente
          # la versione di Visual Studio installata nel runner. Con VS 2026
          # il generatore corretto è Visual Studio 18 2026.
          Remove-Item Env:CMAKE_GENERATOR -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_TOOLSET -ErrorAction SilentlyContinue

          Write-Host '=== BUILD WINDOWS ==='
          flutter build windows --release -v

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) {
            throw "Cartella Release non trovata: $release"
          }

          $exe = Join-Path $release 'preventivi_app.exe'
          if (-not (Test-Path $exe)) {
            $candidate = Get-ChildItem $release -Filter '*.exe' -File | Select-Object -First 1
            if (-not $candidate) {
              throw 'Nessun file EXE trovato nella cartella Release.'
            }
            Copy-Item $candidate.FullName $exe -Force
          }

          $exeInfo = Get-Item $exe
          Write-Host "EXE: $($exeInfo.FullName)"
          Write-Host "Dimensione: $([math]::Round($exeInfo.Length / 1MB, 2)) MB"

          "WINDOWS_RELEASE_DIR=$release" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $env:GITHUB_WORKSPACE 'Preventivi-Windows-Portable.zip'
          Compress-Archive `
            -Path "$env:WINDOWS_RELEASE_DIR\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw 'Preventivi-Windows-Portable.zip non generato.'
          }

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path 'installer' | Out-Null

          @'
          #define MyAppName "Preventivi"
          #define MyAppPublisher "Preventivi"
          #define MyAppExeName "preventivi_app.exe"
          #define MyAppVersion "1.0.0"

          #ifndef ReleaseDir
            #define ReleaseDir "..\build\windows\x64\runner\Release"
          #endif

          #ifndef MyAppVersion
            #define MyAppVersion "1.0.0"
          #endif

          [Setup]
          AppId={{8B7E6B53-9B6D-4B0D-9D8A-7E4F1D5C4E91}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Preventivi
          DefaultGroupName=Preventivi
          DisableProgramGroupPage=yes
          OutputDir=Output
          OutputBaseFilename=Preventivi-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          UninstallDisplayName=Preventivi
          WizardStyle=modern

          [Languages]
          Name: "italian"; MessagesFile: "compiler:Languages\Italian.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Crea un collegamento sul Desktop"; GroupDescription: "Collegamenti aggiuntivi:"

          [Files]
          Source: "{#ReleaseDir}\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\Preventivi"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Preventivi"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Avvia Preventivi"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path 'installer\Preventivi.iss' -Encoding UTF8

          Write-Host 'installer/Preventivi.iss creato.'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'ISCC.exe non trovato.'
          }

          & $iscc `
            "/DReleaseDir=$env:WINDOWS_RELEASE_DIR" `
            '/DMyAppVersion=1.0.0' `
            "$env:GITHUB_WORKSPACE\installer\Preventivi.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup ha restituito codice $LASTEXITCODE."
          }

          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer\Output\Preventivi-Setup.exe'
          if (-not (Test-Path $setup)) {
            throw 'Preventivi-Setup.exe non generato.'
          }

          Copy-Item $setup "$env:GITHUB_WORKSPACE\Preventivi-Setup.exe" -Force
          Write-Host "Installer pronto: $env:GITHUB_WORKSPACE\Preventivi-Setup.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Installer
          path: |
            Preventivi-Setup.exe
            Preventivi-Windows-Portable.zip
          if-no-files-found: error
          compression-level: 0
