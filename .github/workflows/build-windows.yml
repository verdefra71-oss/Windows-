name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Regenerate official Windows project
        shell: powershell
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          flutter create --platforms=windows --project-name=gestione_preventivi .

      - name: Get dependencies
        run: flutter pub get

      - name: Clean generated files
        run: flutter clean

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows app
        shell: powershell
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Gestione-Preventivi-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows
          path: Gestione-Preventivi-Windows.zip
