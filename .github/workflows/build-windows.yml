name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Regenerate official Windows project
        shell: powershell
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          flutter create --platforms=windows --project-name=gestione_preventivi .

      - name: Configure MSVC for Windows notifications plugin
        shell: powershell
        run: |
          $cmake = Get-Content "windows/CMakeLists.txt" -Raw
          if ($cmake -notmatch "SILENCE_EXPERIMENTAL_COROUTINE") {
            $cmake = $cmake -replace '(project\(runner LANGUAGES CXX\)\r?\n)', '$1\n# Compatibility with Visual Studio 2026 STL used by flutter_local_notifications_windows.\nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)\n'
            Set-Content "windows/CMakeLists.txt" $cmake -NoNewline
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Clean generated files
        run: flutter clean

      - name: Remove incompatible template tests
        shell: powershell
        run: |
          if (Test-Path "test") { Remove-Item -Recurse -Force "test" }

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows app
        shell: powershell
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Gestione-Preventivi-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows
          path: Gestione-Preventivi-Windows.zip
