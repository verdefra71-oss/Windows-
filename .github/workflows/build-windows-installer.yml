name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      VisualStudioVersion: '17.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path 'pubspec.yaml') {
            $appDir = (Get-Location).Path
          } else {
            $pubspec = Get-ChildItem -Path . -Filter pubspec.yaml -Recurse -File |
              Select-Object -First 1

            if (-not $pubspec) {
              throw 'pubspec.yaml non trovato'
            }

            $appDir = $pubspec.Directory.FullName
          }

          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Progetto Flutter: $appDir"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name preventivi_app .

          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            throw 'windows/CMakeLists.txt non creato'
          }

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter analyze --no-fatal-infos

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path 'build/windows') {
            Remove-Item 'build/windows' -Recurse -Force
          }

          flutter build windows --release

      - name: Verify Windows build
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Join-Path $PWD 'build/windows/x64/runner/Release'

          if (-not (Test-Path $release)) {
            throw "Cartella Release non trovata: $release"
          }

          $exe = Get-ChildItem $release -Filter '*.exe' -File |
            Select-Object -First 1

          if (-not $exe) {
            throw 'Eseguibile Windows non trovato'
          }

          Write-Host "EXE creato: $($exe.FullName)"

      - name: Create portable ZIP
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $zip = Join-Path $PWD 'build/Preventivi-Windows-portable.zip'

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw 'ZIP portable non creato'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Installazione Inno Setup..."

          choco install innosetup --no-progress -y

          if ($LASTEXITCODE -ne 0) {
            throw "Installazione Inno Setup fallita. Codice: $LASTEXITCODE"
          }

          Write-Host "Installazione Inno Setup completata."

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Ricerca di ISCC.exe..."

          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue

          if ($isccCommand) {
            $iscc = $isccCommand.Source
          } else {
            $possiblePaths = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe',
              'C:\Program Files (x86)\Inno Setup\ISCC.exe',
              'C:\Program Files\Inno Setup\ISCC.exe'
            )

            $iscc = $possiblePaths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $iscc) {
            Write-Host "ISCC non trovato nei percorsi standard."
            Write-Host "Avvio ricerca nelle cartelle Program Files..."

            foreach ($root in @('C:\Program Files (x86)', 'C:\Program Files')) {
              if (Test-Path $root) {
                $found = Get-ChildItem -Path $root -Filter 'ISCC.exe' -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $iscc = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $iscc) {
            Write-Host "ERRORE: ISCC.exe non trovato."
            throw 'ISCC.exe di Inno Setup non trovato'
          }

          Write-Host "Inno Setup trovato: $iscc"

          "ISCC_PATH=$iscc" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create installer script
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path

          $iss = @"
          [Setup]
          AppName=Gestione Preventivi
          AppVersion=1.0.0
          AppPublisher=Il Tornitore
          DefaultDirName={autopf}\Gestione Preventivi
          DefaultGroupName=Gestione Preventivi
          OutputDir=build
          OutputBaseFilename=Preventivi-Windows-Installer
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\preventivi_app.exe
          DisableProgramGroupPage=yes

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"
          Name: "{group}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"

          [Run]
          Filename: "{app}\preventivi_app.exe"; Description: "Avvia Gestione Preventivi"; Flags: nowait postinstall skipifsilent
          "@

          $issPath = Join-Path $PWD 'build/Preventivi.iss'
          $iss | Out-File -FilePath $issPath -Encoding utf8

          if (-not (Test-Path $issPath)) {
            throw 'File Preventivi.iss non creato'
          }

      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ISCC_PATH) {
            throw 'Variabile ISCC_PATH non impostata'
          }

          $iscc = $env:ISCC_PATH
          $iss = Join-Path $PWD 'build/Preventivi.iss'

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe non trovato: $iscc"
          }

          if (-not (Test-Path $iss)) {
            throw "File Inno Setup non trovato: $iss"
          }

          Write-Host "Compilazione installer..."
          Write-Host "ISCC: $iscc"
          Write-Host "ISS : $iss"

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup ha restituito codice $LASTEXITCODE"
          }

          $installer = Join-Path $PWD 'build/Preventivi-Windows-Installer.exe'

          if (-not (Test-Path $installer)) {
            throw 'Installer EXE non creato'
          }

          Write-Host "INSTALLER CREATO CORRETTAMENTE: $installer"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows
          path: |
            ${{ env.APP_DIR }}/build/Preventivi-Windows-Installer.exe
            ${{ env.APP_DIR }}/build/Preventivi-Windows-portable.zip
          if-no-files-found: error
