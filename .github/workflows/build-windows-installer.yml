name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'pubspec.yaml') {
            $appDir = '.'
          } else {
            $pubspec = Get-ChildItem -Path . -Filter pubspec.yaml -Recurse -File | Select-Object -First 1
            if (-not $pubspec) { throw 'pubspec.yaml non trovato' }
            $appDir = $pubspec.Directory.FullName
          }
          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Progetto Flutter: $appDir"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name preventivi_app .

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter analyze --no-fatal-infos

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release

      - name: Verify Windows build
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          if (-not (Test-Path $release)) { throw "Cartella Release non trovata: $release" }
          $exe = Get-ChildItem $release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Eseguibile Windows non trovato' }
          Write-Host "EXE creato: $($exe.FullName)"

      - name: Create portable ZIP
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $zip = Join-Path $PWD 'build/Preventivi-Windows-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y

      - name: Create installer script
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $iss = @"
          [Setup]
          AppName=Gestione Preventivi
          AppVersion=1.0.0
          DefaultDirName={autopf}\Gestione Preventivi
          DefaultGroupName=Gestione Preventivi
          OutputDir=build
          OutputBaseFilename=Preventivi-Windows-Installer
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\preventivi_app.exe
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"
          Name: "{group}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"
          [Run]
          Filename: "{app}\preventivi_app.exe"; Description: "Avvia Gestione Preventivi"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -FilePath 'build/Preventivi.iss' -Encoding utf8

      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe di Inno Setup non trovato' }
          & $iscc.FullName 'build/Preventivi.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha restituito codice $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows
          path: |
            ${{ env.APP_DIR }}/build/Preventivi-Windows-Installer.exe
            ${{ env.APP_DIR }}/build/Preventivi-Windows-portable.zip
          if-no-files-found: error
