name: Build Preventivi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e
          if [ -f "pubspec.yaml" ]; then
            APP_DIR="."
          else
            APP_DIR="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit | xargs -r dirname)"
          fi
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "Errore: pubspec.yaml non trovato" >&2
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Progetto Flutter: $APP_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Prepare Flutter Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          flutter create --platforms=android --project-name preventivi_app .
          echo "Contenuto android/app:"
          find android/app -maxdepth 2 -type f -print | sort

      - name: Configure Android notification permissions
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml non trovato")
          s = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>',
          ]
          for perm in permissions:
              if perm not in s:
                  s = s.replace('<manifest ', '<manifest ', 1)
                  marker = '<application'
                  s = s.replace(marker, perm + '\n    ' + marker, 1)
          manifest.write_text(s)
          print("Permessi notifiche Android configurati.")
          PY

      - name: Configure Android core library desugaring
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          p = groovy if groovy.exists() else kotlin if kotlin.exists() else None
          if p is None:
              raise SystemExit("Nessun android/app/build.gradle o build.gradle.kts trovato")

          s = p.read_text()

          if p.name == "build.gradle":
              if "coreLibraryDesugaringEnabled true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  else:
                      s = s.replace("android {", "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }", 1)
              if "sourceCompatibility JavaVersion.VERSION_17" not in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17", 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if dep not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dep + "\n}\n"
          else:
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  else:
                      s = s.replace("android {", "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              if "JavaVersion.VERSION_17" not in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17", 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if dep not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          print(f"Configurato: {p}")
          PY

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Check project
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
