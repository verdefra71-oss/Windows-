name: Build Preventivi Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      VisualStudioVersion: "17.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "pubspec.yaml") {
            $appDir = (Get-Location).Path
          } else {
            $pubspec = Get-ChildItem -Path . -Filter "pubspec.yaml" -Recurse -File |
              Select-Object -First 1

            if (-not $pubspec) {
              throw "pubspec.yaml non trovato"
            }

            $appDir = $pubspec.Directory.FullName
          }

          "APP_DIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Progetto Flutter: $appDir"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Prepare Windows project
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter config --enable-windows-desktop

          if (-not (Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows --project-name preventivi_app .
          }

          if (-not (Test-Path "windows/CMakeLists.txt")) {
            throw "windows/CMakeLists.txt non trovato dopo flutter create"
          }

          Write-Host "Windows desktop pronto."

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter analyze --no-fatal-infos

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build/windows") {
            Remove-Item "build/windows" -Recurse -Force
          }

          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:VisualStudioVersion = "17.0"

          flutter build windows --release

      - name: Verify Windows build
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = Join-Path $PWD "build/windows/x64/runner/Release"

          if (-not (Test-Path $release)) {
            throw "Cartella Release non trovata: $release"
          }

          $exe = Get-ChildItem $release -Filter "*.exe" -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "Eseguibile Windows non trovato"
          }

          Write-Host "EXE Windows creato: $($exe.FullName)"

      - name: Create portable ZIP
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = Join-Path $PWD "build/windows/x64/runner/Release"
          $zip = Join-Path $PWD "build/Preventivi-Windows-portable.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "ZIP portable non creato"
          }

          Write-Host "ZIP portable creato: $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installazione Inno Setup..."

          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($winget) {
            winget install `
              --id JRSoftware.InnoSetup `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Host "winget non disponibile. Uso Chocolatey..."
            choco install innosetup --no-progress -y

            if ($LASTEXITCODE -ne 0) {
              throw "Installazione Inno Setup fallita. Codice: $LASTEXITCODE"
            }
          }

          Write-Host "Installazione Inno Setup completata."

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Ricerca di ISCC.exe..."

          $iscc = $null

          # Prima prova: PATH
          $cmd = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          }

          # Percorsi standard Inno Setup
          if (-not $iscc) {
            $standardPaths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup\ISCC.exe",
              "C:\Program Files\Inno Setup\ISCC.exe"
            )

            foreach ($path in $standardPaths) {
              if (Test-Path $path) {
                $iscc = $path
                break
              }
            }
          }

          # Ricerca tramite registro uninstall
          if (-not $iscc) {
            $registryRoots = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )

            foreach ($root in $registryRoots) {
              $items = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like "*Inno Setup*" }

              foreach ($item in $items) {
                if ($item.InstallLocation) {
                  $candidate = Join-Path $item.InstallLocation "ISCC.exe"
                  if (Test-Path $candidate) {
                    $iscc = $candidate
                    break
                  }
                }
              }

              if ($iscc) { break }
            }
          }

          # Ultima prova: ricerca nei Program Files
          if (-not $iscc) {
            foreach ($root in @("C:\Program Files (x86)", "C:\Program Files")) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "ISCC.exe" `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $iscc = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $iscc) {
            throw "ISCC.exe di Inno Setup non trovato dopo l'installazione"
          }

          Write-Host "ISCC trovato: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create installer script
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $issPath = Join-Path $PWD "Preventivi.iss"

          $iss = @"
          #define MyAppName "Gestione Preventivi"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Gestione Preventivi"
          #define MyAppExeName "preventivi_app.exe"

          [Setup]
          AppId={{8D9C2E61-7E2B-4A7A-9E0C-4B4B7F9A1234}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Gestione Preventivi
          DefaultGroupName=Gestione Preventivi
          OutputDir=build
          OutputBaseFilename=Preventivi-Windows-Installer
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\{#MyAppExeName}
          DisableProgramGroupPage=yes
          WizardStyle=modern

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\Gestione Preventivi"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\Gestione Preventivi"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Avvia Gestione Preventivi"; Flags: nowait postinstall skipifsilent
          "@

          $iss | Out-File -FilePath $issPath -Encoding utf8

          if (-not (Test-Path $issPath)) {
            throw "File Preventivi.iss non creato"
          }

          Write-Host "Script Inno Setup creato: $issPath"

      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ISCC_PATH) {
            throw "Variabile ISCC_PATH non impostata"
          }

          $iscc = $env:ISCC_PATH
          $iss = Join-Path $PWD "Preventivi.iss"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe non trovato: $iscc"
          }

          if (-not (Test-Path $iss)) {
            throw "File Preventivi.iss non trovato: $iss"
          }

          Write-Host "Compilazione installer..."
          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup ha restituito codice $LASTEXITCODE"
          }

          $installer = Join-Path $PWD "build/Preventivi-Windows-Installer.exe"

          if (-not (Test-Path $installer)) {
            throw "Installer EXE non creato"
          }

          Write-Host "INSTALLER CREATO: $installer"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows
          path: |
            ${{ env.APP_DIR }}/build/Preventivi-Windows-Installer.exe
            ${{ env.APP_DIR }}/build/Preventivi-Windows-portable.zip
          if-no-files-found: error
