name: Build Preventivi Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'pubspec.yaml')) { throw 'pubspec.yaml non trovato nella root del repository.' }
          if (-not (Test-Path 'lib\main.dart')) { throw 'lib/main.dart non trovato.' }
          Write-Host 'Progetto Flutter trovato.'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Recreate Windows platform for Visual Studio 2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # IMPORTANT: the repository contains an old Windows CMake project
          # configured for Visual Studio 2019. Do not try to patch that project:
          # recreate the Flutter Windows platform so no VS2019 configuration
          # survives in CMake files or generated metadata.
          if (Test-Path 'windows') {
            Remove-Item 'windows' -Recurse -Force
          }

          if (Test-Path 'build') {
            Remove-Item 'build' -Recurse -Force
          }

          flutter create --platforms=windows --project-name preventivi_app .

          if (-not (Test-Path 'windows\CMakeLists.txt')) {
            throw 'Flutter non ha generato windows/CMakeLists.txt.'
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe non trovato.'
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw 'Visual Studio 2022 con gli strumenti C++ non trovato.'
          }

          $vsPath = $vsPath.Trim()
          Write-Host "Visual Studio 2022: $vsPath"

          # Prove that the runner really has the VS2022 CMake generator.
          $generators = cmake --help
          if (-not ($generators -match 'Visual Studio 17 2022')) {
            throw 'Il generatore CMake Visual Studio 17 2022 non è disponibile.'
          }

          # Remove any generator variables inherited from the runner/environment
          # and set only the generator that exists on windows-latest.
          Remove-Item Env:CMAKE_GENERATOR -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_TOOLSET -ErrorAction SilentlyContinue

          "CMAKE_GENERATOR=Visual Studio 17 2022" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR_PLATFORM=x64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'Windows platform ricreata con Flutter.'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get

      - name: Analyze application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter analyze lib

      - name: Clean project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }
          if (Test-Path 'windows\flutter\ephemeral') { Remove-Item 'windows\flutter\ephemeral' -Recurse -Force }
          flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Never reuse a CMake cache created with VS2019.
          if (Test-Path 'build\windows') {
            Remove-Item 'build\windows' -Recurse -Force
          }
          if (Test-Path 'windows\flutter\ephemeral') {
            Remove-Item 'windows\flutter\ephemeral' -Recurse -Force
          }

          $env:CMAKE_GENERATOR = 'Visual Studio 17 2022'
          $env:CMAKE_GENERATOR_PLATFORM = 'x64'

          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"
          Write-Host "CMAKE_GENERATOR_PLATFORM=$env:CMAKE_GENERATOR_PLATFORM"

          flutter build windows --release -v

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) { throw "Cartella Release non trovata: $release" }

          $exe = Join-Path $release 'preventivi_app.exe'
          if (-not (Test-Path $exe)) {
            $candidate = Get-ChildItem $release -Filter '*.exe' -File |
              Where-Object { $_.Name -ne 'unins000.exe' } |
              Select-Object -First 1
            if (-not $candidate) { throw 'Nessun file EXE trovato nella cartella Release.' }
            Copy-Item $candidate.FullName $exe -Force
          }

          "WINDOWS_RELEASE_DIR=$release" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release Windows pronta: $release"
          Write-Host "EXE: $exe"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Preventivi-Windows-Portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:WINDOWS_RELEASE_DIR\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'ZIP portatile non generato.' }
          Write-Host "ZIP creato: $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'installer'
          $iss = Join-Path $installerDir 'Preventivi.iss'
          New-Item -ItemType Directory -Path $installerDir -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $installerDir 'Output') -Force | Out-Null

          @'
          #define MyAppName "Preventivi"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Preventivi"
          #define MyAppExeName "preventivi_app.exe"

          [Setup]
          AppId={{8E0E5F6B-8F5E-4A5D-9A9D-1E9A4C9A7F21}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Preventivi
          DefaultGroupName=Preventivi
          DisableProgramGroupPage=yes
          OutputDir=Output
          OutputBaseFilename=Preventivi-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}
          PrivilegesRequired=admin
          WizardStyle=modern

          [Languages]
          Name: "italian"; MessagesFile: "compiler:Languages\Italian.isl"

          [Files]
          Source: "{#ReleaseDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Preventivi"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Preventivi"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Avvia Preventivi"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path $iss -Encoding UTF8

          if (-not (Test-Path $iss)) { throw 'File installer\Preventivi.iss non creato.' }
          Write-Host "Script Inno Setup creato: $iss"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )

          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe non trovato dopo l''installazione di Inno Setup.' }

          $iss = Join-Path $env:GITHUB_WORKSPACE 'installer\Preventivi.iss'
          & $iscc "/DReleaseDir=$env:WINDOWS_RELEASE_DIR" $iss

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha restituito codice $LASTEXITCODE." }

          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer\Output\Preventivi-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Installer non generato: $setup" }

          Copy-Item $setup (Join-Path $env:GITHUB_WORKSPACE 'Preventivi-Setup.exe') -Force
          Write-Host "Installer creato: $setup"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-Windows-Installer
          path: |
            Preventivi-Setup.exe
            Preventivi-Windows-Portable.zip
          if-no-files-found: error
          compression-level: 0
