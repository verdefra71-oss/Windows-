name: Gestione Preventivi - Build APK e Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android platform
        run: flutter create --platforms=android --project-name preventivi_app .

      - name: Configure Android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s, n = re.subn(r'(<manifest\b[^>]*>)', r'\1\n' + permission, s, count=1)
              if n != 1:
                  raise SystemExit('AndroidManifest.xml: tag manifest non trovato')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato. ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path('android/app/build.gradle')
          kts = Path('android/app/build.gradle.kts')

          if kts.exists():
              p = kts
              s = p.read_text(encoding='utf-8')
              # Kotlin DSL uses: compileSdk = 36
              if re.search(r'(?m)^\s*compileSdk\s*(?:=\s*)?\d+', s):
                  s = re.sub(r'(?m)^(\s*compileSdk\s*)(?:=\s*)?\d+', r'\1= 36', s, count=1)
              else:
                  raise SystemExit('Impossibile impostare compileSdk 36 nel build.gradle.kts')
              if not re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', s):
                  raise SystemExit('Impossibile impostare compileSdk 36 nel build.gradle.kts')
              p.write_text(s, encoding='utf-8')
          elif groovy.exists():
              p = groovy
              s = p.read_text(encoding='utf-8')
              s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk 36', s, count=1)
              if n == 0:
                  s, n = re.subn(r'compileSdk\s+[^\n]+', 'compileSdk 36', s, count=1)
              if n == 0:
                  raise SystemExit('Impossibile impostare compileSdk 36 nel build.gradle')
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Nessun build.gradle o build.gradle.kts trovato')
          PY

      - name: Enable core library desugaring
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path('android/app/build.gradle')
          kts = Path('android/app/build.gradle.kts')

          if kts.exists():
              p = kts
              s = p.read_text(encoding='utf-8')
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  marker = '    compileOptions {\n'
                  if marker in s:
                      s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n', 1)
                  else:
                      raise SystemExit('android/app/build.gradle.kts: compileOptions non trovato')
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              p.write_text(s, encoding='utf-8')
          elif groovy.exists():
              p = groovy
              s = p.read_text(encoding='utf-8')
              if 'coreLibraryDesugaringEnabled true' not in s:
                  marker = '    compileOptions {\n'
                  if marker in s:
                      s = s.replace(marker, marker + '        coreLibraryDesugaringEnabled true\n', 1)
                  else:
                      raise SystemExit('android/app/build.gradle: compileOptions non trovato')
              if 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:' not in s:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('Nessun build.gradle o build.gradle.kts trovato')
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE + Setup
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform
        shell: pwsh
        run: flutter create --platforms=windows --project-name preventivi_app .

      - name: Configure Windows icon
        shell: pwsh
        run: |
          $icon = Join-Path $env:GITHUB_WORKSPACE 'assets\app_icon.ico'
          $resources = Join-Path $env:GITHUB_WORKSPACE 'windows\runner\resources'
          $target = Join-Path $resources 'app_icon.ico'
          if (-not (Test-Path $icon)) { throw "Icona non trovata: $icon" }
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item $icon $target -Force
          $rc = Join-Path $env:GITHUB_WORKSPACE 'windows\runner\Runner.rc'
          $txt = Get-Content $rc -Raw
          $txt = [regex]::Replace($txt, '(?m)^IDI_ICON1\s+[^\r\n]+$', 'IDI_ICON1 ICON "resources\\app_icon.ico"')
          Set-Content $rc $txt -Encoding ASCII

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force $installer | Out-Null
          $iss = @"
          [Setup]
          AppName=Gestione Preventivi
          AppVersion=1.1.0
          AppPublisher=Gestione Preventivi
          DefaultDirName={autopf}\Gestione Preventivi
          DefaultGroupName=Gestione Preventivi
          OutputDir=$installer
          OutputBaseFilename=Gestione-Preventivi-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=$env:GITHUB_WORKSPACE\assets\app_icon.ico
          UninstallDisplayIcon={app}\preventivi_app.exe

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"
          Name: "{commondesktop}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"

          [Run]
          Filename: "{app}\preventivi_app.exe"; Description: "Avvia Gestione Preventivi"; Flags: nowait postinstall skipifsilent
          "@
          $issPath = Join-Path $env:GITHUB_WORKSPACE 'preventivi.iss'
          Set-Content $issPath $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $issPath
          if (-not (Test-Path (Join-Path $installer 'Gestione-Preventivi-Setup.exe'))) { throw 'Installer non creato' }

      - name: Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'Gestione-Preventivi-Windows-Portable.zip' -Force

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows
          path: |
            Gestione-Preventivi-Windows-Portable.zip
            installer/Gestione-Preventivi-Setup.exe
          if-no-files-found: error
