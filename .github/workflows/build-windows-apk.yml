name: Build Gestione Preventivi - Windows + APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e
          if [ -f "pubspec.yaml" ]; then
            APP_DIR="."
          else
            APP_DIR="$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit | xargs -r dirname)"
          fi
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "Errore: pubspec.yaml non trovato" >&2
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          flutter create --platforms=android --project-name preventivi_app .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if permission not in s:
              end = s.find('>')
              if end < 0:
                  raise SystemExit("Manifest non valido")
              s.write_text(s[:end+1] + "\n" + permission + s[end+1:])
          PY

      - name: Configure Android desugaring
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          p = groovy if groovy.exists() else kotlin if kotlin.exists() else None
          if p is None:
              raise SystemExit("Nessun build.gradle trovato")

          s = p.read_text()

          if p.name == "build.gradle":
              if "coreLibraryDesugaringEnabled true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace("compileOptions {",
                                    "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  else:
                      s = s.replace("android {",
                                    "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }", 1)
              if "sourceCompatibility JavaVersion.VERSION_17" not in s:
                  s = s.replace("compileOptions {",
                                "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17", 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if dep not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dep + "\n}\n"
          else:
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace("compileOptions {",
                                    "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  else:
                      s = s.replace("android {",
                                    "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              if "JavaVersion.VERSION_17" not in s:
                  s = s.replace("compileOptions {",
                                "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17", 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if dep not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE + installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Path . -Filter pubspec.yaml -Recurse |
            Where-Object { $_.FullName -notmatch '\\.dart_tool\\' } |
            Select-Object -First 1
          if (-not $pub) { throw "pubspec.yaml non trovato" }
          "APP_DIR=$($pub.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Prepare Windows
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (Test-Path 'windows') { Remove-Item -Recurse -Force 'windows' }
          flutter create --platforms=windows --project-name preventivi_app .
          flutter pub get

          $icon = Join-Path $env:APP_DIR 'assets\app_icon.ico'
          $target = Join-Path $env:APP_DIR 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw "Icona Windows non trovata: $icon" }
          Copy-Item $icon $target -Force

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Configure Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $app = "${{ env.APP_DIR }}\build\windows\x64\runner\Release"
          if (-not (Test-Path $app)) { throw "Build Windows non trovata" }
          Compress-Archive -Path "$app\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\Gestione-Preventivi-Windows-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Gestione Preventivi
          AppVersion=1.1.0
          AppPublisher=Gestione Preventivi
          DefaultDirName={autopf}\Gestione Preventivi
          DefaultGroupName=Gestione Preventivi
          OutputDir=$env:GITHUB_WORKSPACE\installer
          OutputBaseFilename=Gestione-Preventivi-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\preventivi_app.exe

          [Files]
          Source: "${{ env.APP_DIR }}\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"
          Name: "{commondesktop}\Gestione Preventivi"; Filename: "{app}\preventivi_app.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Crea un collegamento sul desktop"; GroupDescription: "Collegamenti:"

          [Run]
          Filename: "{app}\preventivi_app.exe"; Description: "Avvia Gestione Preventivi"; Flags: nowait postinstall skipifsilent
          "@

          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\installer" | Out-Null
          Set-Content "$env:GITHUB_WORKSPACE\preventivi.iss" $iss -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$env:GITHUB_WORKSPACE\preventivi.iss"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\installer\Gestione-Preventivi-Setup.exe")) {
            throw "Installer non creato"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows
          path: |
            Gestione-Preventivi-Windows-Portable.zip
            installer/Gestione-Preventivi-Setup.exe
          if-no-files-found: error
